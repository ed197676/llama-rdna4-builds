name: Build llama.cpp RDNA4 Boosts - Windows ROCm

on:
  workflow_dispatch:
    inputs:
      gpu_target:
        description: RDNA4 target (gfx1201 = RX 9070/9070 XT/R9700; gfx1200 = RX 9060 XT)
        required: true
        default: gfx1201
        type: choice
        options:
          - gfx1201
          - gfx1200
      rocm_version:
        description: ROCm version
        required: true
        default: 7.14.1
        type: choice
        options:
          - 7.14.1
          - 10.0.0
      boosts_release:
        description: Published stew675/llama-cpp-rdna-boosts release tag
        required: true
        default: v16-ebbb18522-r9
        type: string

permissions:
  contents: read

concurrency:
  group: rdna4-${{ github.ref }}-${{ inputs.gpu_target }}-rocm${{ inputs.rocm_version }}-${{ inputs.boosts_release }}
  cancel-in-progress: false

env:
  LLAMA_REPO: https://github.com/ggml-org/llama.cpp.git
  BOOSTS_REPO: https://github.com/stew675/llama-cpp-rdna-boosts.git
  ROCM_VERSION: ${{ inputs.rocm_version }}
  GPU_TARGET: ${{ inputs.gpu_target }}
  BOOSTS_RELEASE: ${{ inputs.boosts_release }}

jobs:
  build:
    name: Win11 ${{ inputs.boosts_release }} / ROCm ${{ inputs.rocm_version }} / ${{ inputs.gpu_target }}
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout pinned RDNA boosts release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          git config --global core.autocrlf false
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git clone --branch $env:BOOSTS_RELEASE --depth 1 $env:BOOSTS_REPO rdna-boosts

          Set-Location rdna-boosts
          $boostsSha = (git rev-parse HEAD).Trim()
          Set-Location ..

          "BOOSTS_SHA=$boostsSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RDNA boosts release: $env:BOOSTS_RELEASE"
          Write-Host "RDNA boosts commit:  $boostsSha"

      - name: Validate release manifest and patch artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = Join-Path $env:GITHUB_WORKSPACE 'rdna-boosts'
          $manifestPath = Join-Path $repo 'release.json'
          if (-not (Test-Path $manifestPath)) {
            throw "Pinned release does not contain release.json: $manifestPath"
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json

          if ([string]$manifest.release -ne $env:BOOSTS_RELEASE) {
            throw "release.json identity mismatch: manifest='$($manifest.release)' requested='$env:BOOSTS_RELEASE'"
          }

          $base = [string]$manifest.base
          $baseTree = [string]$manifest.base_tree
          $expectedTree = [string]$manifest.tree
          $nBlocks = [int]$manifest.n_blocks

          if ([string]::IsNullOrWhiteSpace($base)) { throw 'release.json has no base SHA.' }
          if ([string]::IsNullOrWhiteSpace($expectedTree)) { throw 'release.json has no canonical tree.' }
          if ($nBlocks -lt 1) { throw "Invalid n_blocks in release.json: $nBlocks" }

          $patchProperties = @($manifest.patches.PSObject.Properties | Sort-Object Name)
          if ($patchProperties.Count -ne $nBlocks) {
            throw "release.json says n_blocks=$nBlocks but records $($patchProperties.Count) patch hashes."
          }

          $patchDir = Join-Path $repo 'patches'
          $actualPatches = @(Get-ChildItem -Path $patchDir -Filter '*.patch' -File | Sort-Object Name)
          if ($actualPatches.Count -ne $nBlocks) {
            throw "Release checkout contains $($actualPatches.Count) patch files, expected $nBlocks."
          }

          foreach ($entry in $patchProperties) {
            $patchPath = Join-Path $patchDir $entry.Name
            if (-not (Test-Path $patchPath)) {
              throw "release.json records a missing patch: $($entry.Name)"
            }
            $got = (Get-FileHash -Path $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $want = ([string]$entry.Value).ToLowerInvariant()
            if ($got -ne $want) {
              throw "SHA256 mismatch for $($entry.Name): have=$got want=$want"
            }
            Write-Host "Patch hash OK: $($entry.Name)"
          }

          "LLAMA_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_BASE_TREE=$baseTree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TREE=$expectedTree" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_N_BLOCKS=$nBlocks" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Release:         $($manifest.release)"
          Write-Host "llama.cpp base:  $base"
          Write-Host "Blocks:          $nBlocks"
          Write-Host "Canonical tree:  $expectedTree"

      - name: Checkout recorded llama.cpp base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          git clone $env:LLAMA_REPO llama.cpp
          Set-Location llama.cpp
          git checkout --detach $env:LLAMA_BASE

          $baseSha = (git rev-parse HEAD).Trim()
          $baseTree = (git rev-parse 'HEAD^{tree}').Trim()

          if ($env:RELEASE_BASE_TREE -and $baseTree -ne $env:RELEASE_BASE_TREE) {
            throw "llama.cpp base tree mismatch: have=$baseTree expected=$env:RELEASE_BASE_TREE"
          }

          "LLAMA_BASE_SHA=$baseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "llama.cpp base SHA:  $baseSha"
          Write-Host "llama.cpp base tree: $baseTree"

      - name: Apply pinned RDNA boosts release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $boostsDir = Join-Path $env:GITHUB_WORKSPACE 'rdna-boosts'
          $llamaDir = Join-Path $env:GITHUB_WORKSPACE 'llama.cpp'
          $bash = 'C:\Program Files\Git\bin\bash.exe'

          if (-not (Test-Path $bash)) {
            throw "Git Bash not found at expected path: $bash"
          }

          $applyCommand = 'RDNA="$(cygpath -u "$1")"; LLAMA="$(cygpath -u "$2")"; bash "$RDNA/scripts/apply-all.sh" "$LLAMA" "$RDNA"'
          $applyOutput = @(& $bash -lc $applyCommand -- $boostsDir $llamaDir 2>&1)
          $applyExit = $LASTEXITCODE
          $applyOutput | ForEach-Object { Write-Host $_ }

          if ($applyExit -ne 0) {
            throw "scripts/apply-all.sh failed with exit code $applyExit"
          }

          Set-Location $llamaDir

          $applied = [int](git rev-list --count "$env:LLAMA_BASE_SHA..HEAD")
          if ($applied -ne [int]$env:RELEASE_N_BLOCKS) {
            throw "Applied commit count is $applied; release.json requires $env:RELEASE_N_BLOCKS."
          }

          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($tree -ne $env:RELEASE_TREE) {
            throw "Applied tree mismatch: have=$tree expected=$env:RELEASE_TREE"
          }

          $dirty = git status --porcelain
          if ($dirty) {
            throw "Patched tree is dirty after apply-all.sh:`n$dirty"
          }

          git diff --check "$env:LLAMA_BASE_SHA..HEAD"

          $patchedSha = (git rev-parse HEAD).Trim()
          "PATCHED_SHA=$patchedSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Applied blocks:          $applied"
          Write-Host "Patched llama.cpp HEAD:  $patchedSha"
          Write-Host "Patched canonical tree:  $tree"

      - name: Install selected ROCm SDK for RDNA4 target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          New-Item -Path 'C:\TheRock\build' -ItemType Directory -Force | Out-Null
          python -m venv C:\TheRock\build\.venv
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip

          if ($env:ROCM_VERSION -eq '7.14.1') {
            $rocmPackage = "rocm[libraries,devel,device-$env:GPU_TARGET]==$env:ROCM_VERSION"
            Write-Host "Installing $rocmPackage from ROCm 7.14.1 multi-arch release index"
            python -m pip install --index-url 'https://repo.amd.com/rocm/whl-multi-arch/' $rocmPackage
          }
          elseif ($env:ROCM_VERSION -eq '10.0.0') {
            $rocmPackage = "rocm[libraries,devel,device-$env:GPU_TARGET]==$env:ROCM_VERSION"
            Write-Host "Installing $rocmPackage from ROCm whl-next index"
            python -m pip install --index-url 'https://stable.repo.amd.com/rocm/whl-next/' $rocmPackage
          }
          else {
            throw "Unsupported ROCm version: $env:ROCM_VERSION"
          }

          rocm-sdk init
          if ($LASTEXITCODE -ne 0) {
            throw "rocm-sdk init failed with exit code $LASTEXITCODE"
          }

          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()

          if (-not $rocmPath -or -not (Test-Path $rocmPath)) { throw 'Invalid ROCm root.' }
          if (-not $cmakePath -or -not (Test-Path $cmakePath)) { throw 'Invalid ROCm CMake path.' }
          if (-not $binPath -or -not (Test-Path $binPath)) { throw 'Invalid ROCm bin path.' }

          Write-Host "ROCm version: $env:ROCM_VERSION"
          Write-Host "ROCm root:    $rocmPath"
          Write-Host "ROCm cmake:   $cmakePath"
          Write-Host "ROCm bin:     $binPath"

          "ROCM_ROOT=$rocmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROCM_BIN=$binPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HIP_PATH=$rocmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$cmakePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HIP_PLATFORM=amd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_PATH=$rocmPath\lib\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\TheRock\build\.venv\Scripts' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & "$rocmPath\lib\llvm\bin\clang.exe" --version

      - name: Install Ninja for HIP backend build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install ninja -y --no-progress
          ninja --version

      - name: Build patched Windows CPU tools
        shell: pwsh
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cmake -S . -B build-cpu -G 'Visual Studio 17 2022' -A x64 `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_CURL=OFF `
            -DGGML_RPC=OFF

          cmake --build build-cpu --config Release --parallel $env:NUMBER_OF_PROCESSORS `
            --target llama-server llama-cli llama-bench

      - name: Build patched ROCm HIP backend
        shell: pwsh
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          cmake -S . -B build-hip -G 'Ninja Multi-Config' `
            -DCMAKE_PREFIX_PATH="$env:ROCM_ROOT" `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=OFF `
            -DGGML_HIP=ON `
            -DGGML_HIP_GRAPHS=ON `
            -DGGML_HIP_RCCL=OFF `
            -DCMAKE_C_COMPILER="$env:ROCM_ROOT\lib\llvm\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$env:ROCM_ROOT\lib\llvm\bin\clang++.exe" `
            -DCMAKE_C_FLAGS='-Wno-error=incompatible-pointer-types' `
            -DCMAKE_HIP_COMPILER="$env:ROCM_ROOT\lib\llvm\bin\clang.exe" `
            -DHIP_PATH="$env:ROCM_ROOT" `
            -DAMDGPU_TARGETS="$env:GPU_TARGET" `
            -DGPU_TARGETS="$env:GPU_TARGET"

          cmake --build build-hip --config Release --parallel $env:NUMBER_OF_PROCESSORS --target ggml-hip

      - name: Verify build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cpuBin = Join-Path $env:GITHUB_WORKSPACE 'llama.cpp\build-cpu\bin\Release'
          $hipBin = Join-Path $env:GITHUB_WORKSPACE 'llama.cpp\build-hip\bin\Release'

          $requiredCpu = @('llama-server.exe', 'llama-cli.exe', 'llama-bench.exe')
          foreach ($name in $requiredCpu) {
            $path = Join-Path $cpuBin $name
            if (-not (Test-Path $path)) { throw "Required CPU/tool output missing: $path" }
            Get-Item $path | Format-Table Name, Length, LastWriteTime -AutoSize
          }

          $hipDll = Join-Path $hipBin 'ggml-hip.dll'
          if (-not (Test-Path $hipDll)) { throw "Required HIP backend missing: $hipDll" }
          Get-Item $hipDll | Format-Table Name, Length, LastWriteTime -AutoSize

      - name: Package portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $workspace = $env:GITHUB_WORKSPACE
          $cpuBin = Join-Path $workspace 'llama.cpp\build-cpu\bin\Release'
          $hipBin = Join-Path $workspace 'llama.cpp\build-hip\bin\Release'
          $outRoot = Join-Path $workspace 'artifacts'
          $portableName = "llama-rdna-boosts-$env:BOOSTS_RELEASE-win-rocm$env:ROCM_VERSION-$env:GPU_TARGET-portable"
          $portable = Join-Path $outRoot $portableName
          New-Item -ItemType Directory -Force -Path $portable | Out-Null

          $wantedExe = @('llama-server.exe', 'llama-cli.exe', 'llama-bench.exe')
          foreach ($exe in $wantedExe) {
            Copy-Item (Join-Path $cpuBin $exe) $portable -Force
          }
          Get-ChildItem -Path $cpuBin -Filter '*.dll' -File | Copy-Item -Destination $portable -Force
          Copy-Item (Join-Path $hipBin 'ggml-hip.dll') $portable -Force

          Get-ChildItem -Path $env:ROCM_BIN -Filter '*.dll' -File | Copy-Item -Destination $portable -Force

          $opensslDlls = @('libssl-3-x64.dll', 'libcrypto-3-x64.dll')
          $opensslSearchRoots = @(
            'C:\Program Files\OpenSSL\bin',
            'C:\Program Files\OpenSSL-Win64\bin',
            'C:\Program Files\Git\mingw64\bin',
            'C:\Strawberry\c\bin'
          )

          foreach ($dll in $opensslDlls) {
            $src = $null
            foreach ($root in $opensslSearchRoots) {
              $candidate = Join-Path $root $dll
              if (Test-Path $candidate) {
                $src = $candidate
                break
              }
            }

            if (-not $src) {
              $src = Get-ChildItem -Path 'C:\Program Files' -Filter $dll -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }

            if (-not $src) {
              throw "Could not locate required OpenSSL runtime DLL on runner: $dll"
            }

            Copy-Item $src $portable -Force
            Write-Host "Bundled OpenSSL runtime: $src"
          }

          function Copy-KernelTree {
            param(
              [Parameter(Mandatory=$true)][string]$Name,
              [Parameter(Mandatory=$true)][string]$DestinationRoot
            )

            $directCandidates = @(
              (Join-Path $env:ROCM_BIN $Name),
              (Join-Path $env:ROCM_ROOT "bin\$Name"),
              (Join-Path $env:ROCM_ROOT "lib\$Name"),
              (Join-Path $env:ROCM_ROOT "lib64\$Name")
            ) | Select-Object -Unique

            foreach ($candidate in $directCandidates) {
              if (Test-Path (Join-Path $candidate 'library')) {
                $dest = Join-Path $DestinationRoot $Name
                New-Item -ItemType Directory -Force -Path $dest | Out-Null
                Copy-Item (Join-Path $candidate 'library') $dest -Recurse -Force
                Write-Host "Copied $Name kernel tree from $candidate"
                return
              }
            }

            $libraries = @(Get-ChildItem -Path $env:ROCM_ROOT -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'library' -and $_.Parent.Name -eq $Name })
            if ($libraries.Count -lt 1) {
              throw "Could not locate $Name/library under ROCm root; portable package would be incomplete."
            }

            $dest = Join-Path $DestinationRoot "$Name\library"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            foreach ($libdir in $libraries) {
              Copy-Item (Join-Path $libdir.FullName '*') $dest -Recurse -Force
              Write-Host "Merged $Name kernels from $($libdir.FullName)"
            }
          }

          Copy-KernelTree -Name 'rocblas' -DestinationRoot $portable

          try {
            Copy-KernelTree -Name 'hipblaslt' -DestinationRoot $portable
          }
          catch {
            Write-Warning "hipblaslt/library was not found: $($_.Exception.Message)"
          }

          $mustHavePortable = @(
            'ggml-hip.dll',
            'amdhip64_7.dll',
            'hipblas.dll',
            'rocblas.dll',
            'libssl-3-x64.dll',
            'libcrypto-3-x64.dll'
          )
          foreach ($name in $mustHavePortable) {
            if (-not (Test-Path (Join-Path $portable $name))) {
              throw "Portable package is missing required DLL: $name"
            }
          }

          $rocblasLibrary = Join-Path $portable 'rocblas\library'
          if (-not (Test-Path $rocblasLibrary) -or -not (Get-ChildItem $rocblasLibrary -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) {
            throw 'Portable package is missing the rocBLAS kernel library tree.'
          }

          $buildInfo = @"
          llama.cpp RDNA Boosts - Windows portable build
          =================================================
          Build date (UTC):  $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')
          GPU target:        $env:GPU_TARGET
          ROCm SDK:          $env:ROCM_VERSION
          Boosts release:    $env:BOOSTS_RELEASE
          Boosts repo SHA:   $env:BOOSTS_SHA
          Release blocks:    $env:RELEASE_N_BLOCKS
          llama.cpp base:    $env:LLAMA_BASE_SHA
          Canonical tree:    $env:RELEASE_TREE
          Patched HEAD:      $env:PATCHED_SHA
          Packaging model:   patched MSVC tools + patched dynamic ggml-hip backend
          HIP graphs:        ON
          RCCL:              OFF (single-GPU portable build)
          CURL:              OFF (local GGUF usage; fewer runtime dependencies)

          Sources:
          https://github.com/ggml-org/llama.cpp
          https://github.com/stew675/llama-cpp-rdna-boosts
          "@

          $portableNotes = @"
          PORTABLE PACKAGE
          ================
          This package includes ROCm $env:ROCM_VERSION runtime DLLs and the rocBLAS
          kernel library tree for $env:GPU_TARGET. No separate ROCm SDK installation
          should be required for this package itself.

          Test on the RDNA4 Windows 11 machine:
              TEST-RDNA4.cmd

          Or from PowerShell:
              .\llama-server.exe --list-devices

          A GitHub-hosted Windows runner has no RDNA4 GPU, so final GPU enumeration
          can only be verified on the target PC.
          "@

          $testCmd = @"
          @echo off
          setlocal
          set "PATH=%~dp0;%PATH%"
          echo Testing RDNA4 device detection...
          "%~dp0llama-server.exe" --list-devices
          echo.
          pause
          "@

          $runCmd = @"
          @echo off
          setlocal
          set "PATH=%~dp0;%PATH%"
          "%~dp0llama-server.exe" %*
          "@

          $buildInfo | Set-Content -Path (Join-Path $portable 'BUILD-INFO.txt') -Encoding utf8
          $portableNotes | Set-Content -Path (Join-Path $portable 'PORTABLE-NOTES.txt') -Encoding utf8
          $testCmd | Set-Content -Path (Join-Path $portable 'TEST-RDNA4.cmd') -Encoding ascii
          $runCmd | Set-Content -Path (Join-Path $portable 'RUN-LLAMA-SERVER.cmd') -Encoding ascii

          Copy-Item (Join-Path $workspace 'llama.cpp\LICENSE') $portable -Force
          Copy-Item (Join-Path $workspace 'rdna-boosts\release.json') (Join-Path $portable 'RDNA-BOOSTS-RELEASE.json') -Force

          if (Test-Path (Join-Path $workspace 'rdna-boosts\LICENSE')) {
            Copy-Item (Join-Path $workspace 'rdna-boosts\LICENSE') (Join-Path $portable 'LICENSE-rdna-boosts') -Force
          }

          Push-Location $portable
          $savedPath = $env:PATH
          try {
            $env:PATH = "$portable;C:\Windows\System32;C:\Windows"
            & '.\llama-cli.exe' --version
            if ($LASTEXITCODE -ne 0) {
              throw "Portable clean-PATH smoke test failed with exit code $LASTEXITCODE"
            }
            & '.\llama-server.exe' --version
            if ($LASTEXITCODE -ne 0) {
              throw "Portable server clean-PATH smoke test failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            $env:PATH = $savedPath
            Pop-Location
          }

          Get-ChildItem -Path $portable -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Path (Join-Path $portable 'SHA256SUMS.txt') -Encoding ascii

          "PORTABLE_NAME=$portableName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'Portable package top level:'
          Get-ChildItem $portable | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable RDNA4 package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PORTABLE_NAME }}
          path: artifacts/${{ env.PORTABLE_NAME }}/
          if-no-files-found: error
          compression-level: 7
          retention-days: 7
